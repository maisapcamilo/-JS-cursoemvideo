<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div#area {
            font: normal 20pt Times;
            background: rgb(83, 238, 83);
            color: black;
            width: 200px;
            height: 200px;
            line-height: 200px;
            text-align: center;

        }
        div#area1 {
            font: normal 20pt Times;
            background: rgb(131, 196, 131);
            color: black;
            width: 200px;
            height: 200px;
            line-height: 200px;
            text-align: center;

        }
        div#area2 {
            font: normal 20pt Times;
            background: rgb(83, 238, 83);
            color: black;
            width: 200px;
            height: 200px;
            line-height: 200px;
            text-align: center;

        }
    </style>
</head>
<body>
    <div id="area">
        Interaja...
    </div> 
    

    <script>
        //onclick="clicar()" onmouseenter="entrar()" onmouseout="sair()" isso estava dentro da div antes do outro comando ser apresentado
        var a = window.document.getElementById('area')
        a.addEventListener('click', clicar)
        a.addEventListener('mouseenter', entrar)
        a.addEventListener('mouseout', sair)
        
        function clicar() {
            //var a = window.document.getElementById('area')
            a.innerText = 'Clicou!'
            a.style.background = 'red'

        }
      
        function entrar() {
            a.innerText = 'Entrou!'
        }
        function sair() {
            a.innerText = 'Saiu!'
            a.style.background = 'green'
        }
    </script>
</body>
</html>
